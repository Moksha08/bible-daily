<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Bible Daily</title>
  <meta name="description" content="You're offline. Bible Daily works offline for previously loaded content.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fdf8f3 0%, #faebe1 100%);
      padding: 20px;
      color: #1a1a2e;
    }
    .dark body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fdf8f3; }
    .container { text-align: center; max-width: 400px; }
    .icon { font-size: 80px; margin-bottom: 24px; animation: bounce 2s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
    p { color: #666; line-height: 1.6; margin-bottom: 24px; }
    .dark p { color: #999; }
    .features { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; text-align: left; }
    .feature { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: rgba(255,255,255,0.8); border-radius: 12px; backdrop-filter: blur(8px); }
    .dark .feature { background: rgba(255,255,255,0.1); }
    .feature-icon { font-size: 20px; }
    button {
      background: #d47032;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #c05826; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .retry { margin-top: 16px; color: #d47032; text-decoration: none; font-weight: 500; }
    .retry:hover { text-decoration: underline; }
    .verse { margin-top: 32px; padding: 20px; background: rgba(255,255,255,0.9); border-radius: 16px; font-style: italic; }
    .dark .verse { background: rgba(255,255,255,0.1); }
    .verse-text { font-size: 16px; line-height: 1.7; margin-bottom: 8px; }
    .verse-ref { font-size: 14px; color: #888; font-style: normal; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📖</div>
    <h1>You're Offline</h1>
    <p>Don't worry! Bible Daily works offline for content you've already viewed.</p>
    
    <div class="features">
      <div class="feature">
        <span class="feature-icon">✅</span>
        <span>Previously loaded verses available</span>
      </div>
      <div class="feature">
        <span class="feature-icon">✅</span>
        <span>Saved prayers accessible</span>
      </div>
      <div class="feature">
        <span class="feature-icon">✅</span>
        <span>Favorites work offline</span>
      </div>
      <div class="feature">
        <span class="feature-icon">⏳</span>
        <span>New content loads when online</span>
      </div>
    </div>

    <button onclick="window.location.reload()">Try Again</button>
    <a href="#" class="retry" onclick="window.location.reload()">Refresh Page</a>

    <div class="verse">
      <div class="verse-text">"The Lord is my shepherd; I shall not want."</div>
      <div class="verse-ref">— Psalm 23:1</div>
    </div>
  </div>

  <script>
    // Check if online periodically
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 5000);

    // Listen for online event
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
